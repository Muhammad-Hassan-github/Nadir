workflows:
  android-build:
    name: Build Android APK
    environment:
      sdk: "30.0.3"
      java: "11"
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build release APK
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
